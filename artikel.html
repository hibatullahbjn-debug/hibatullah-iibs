  <script>
  (function(){
    // Get article index from URL ?id=0
    var params = new URLSearchParams(window.location.search);
    var idx = parseInt(params.get('id') || '0', 10);

    function months(){ return ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; }
    function fmtDate(d){ try{ var dt=new Date(d); return dt.getDate()+' '+months()[dt.getMonth()]+' '+dt.getFullYear(); }catch(e){return d;} }

    function loadArticle(items, allItems, articleIdx) {
      if (!allItems) allItems = items;
      var idx2 = (articleIdx !== undefined) ? articleIdx : idx;
      if (idx2 < 0 || idx2 >= items.length) idx2 = 0;
      var item = items[idx2];
      var img = item.thumbnail || 'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=1200&q=80';
      var cat = item.categories && item.categories[0] ? item.categories[0] : 'Blog';

      document.title = item.title + ' - Hibatullah IIBS';
      document.getElementById('artBcTitle').textContent = item.title.length > 50 ? item.title.substring(0,50)+'...' : item.title;
      document.getElementById('artImg').src = img;
      document.getElementById('artImg').onerror = function(){ this.src='https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=1200&q=80'; };
      document.getElementById('artCat').textContent = cat.toUpperCase();
      document.getElementById('artCat2').textContent = cat;
      document.getElementById('artTitle').textContent = item.title;
      document.getElementById('artAuthor').textContent = (item.author && item.author.indexOf('@') === -1) ? item.author : 'Admin';
      document.getElementById('artDate').textContent = fmtDate(item.pubDate);
      // Ekstrak semua gambar bawaan artikel (termasuk galeri di bawah) untuk didistribusikan
      var tempDiv = document.createElement('div');
      tempDiv.innerHTML = item.content || '<p>'+item.description+'</p>';
      
      var extractedEls = [];
      var allContentImgs = tempDiv.querySelectorAll('img');
      allContentImgs.forEach(function(imgEl) {
          var parent = imgEl.parentNode;
          if (parent.tagName === 'FIGURE' || parent.classList.contains('wp-block-image')) {
              extractedEls.push(parent.cloneNode(true));
              parent.remove();
          } else if (parent.tagName === 'A' && parent.parentNode.tagName === 'FIGURE') {
              extractedEls.push(parent.parentNode.cloneNode(true));
              parent.parentNode.remove();
          } else if (parent.tagName === 'LI') {
              var clonedImg = imgEl.cloneNode(true);
              extractedEls.push(clonedImg);
              parent.remove();
          } else {
              extractedEls.push(imgEl.cloneNode(true));
              imgEl.remove();
          }
      });
      
      // Bersihkan sisa wrapper galeri kosong
      var galleries = tempDiv.querySelectorAll('.wp-block-gallery, .gallery, .blocks-gallery-grid');
      galleries.forEach(function(g) { g.remove(); });
      
      // Distribusikan gambar yang sudah diekstrak ke sela-sela paragraf
      var paragraphs = tempDiv.querySelectorAll('p');
      var imgIdx = 0;
      
      if (paragraphs.length > 0 && extractedEls.length > 0) {
          // Hitung jarak ideal agar gambar tersebar merata (min. tiap 2 paragraf)
          var gap = Math.ceil(paragraphs.length / (extractedEls.length + 1));
          if (gap < 2) gap = 2; 
          if (gap > 4) gap = 3; // Max tiap 3 paragraf agar tidak terlalu jauh
          
          for (var i = 1; i < paragraphs.length; i += gap) {
              if (imgIdx < extractedEls.length) {
                  paragraphs[i].parentNode.insertBefore(extractedEls[imgIdx], paragraphs[i].nextSibling);
                  imgIdx++;
              }
          }
          
          // Jika masih ada sisa gambar, taruh di paling bawah
          while(imgIdx < extractedEls.length) {
              tempDiv.appendChild(extractedEls[imgIdx]);
              imgIdx++;
          }
      }
      
      document.getElementById('artContent').innerHTML = tempDiv.innerHTML;

      // Extract excerpt and decode HTML entities
      var rawExcerpt = (item.description || item.content.replace(/<[^>]+>/g, '')).substring(0, 160).trim() + '...';
      var tempTextArea = document.createElement('textarea');
      tempTextArea.innerHTML = rawExcerpt;
      var excerpt = tempTextArea.value.replace(/\s+/g, ' ');
      
      // Inject Dynamic Meta Tags (Best Effort for JS-capable crawlers like Telegram/Twitter)
      var ogTitle = document.querySelector('meta[property="og:title"]');
      if (!ogTitle) { ogTitle = document.createElement('meta'); ogTitle.setAttribute('property', 'og:title'); document.head.appendChild(ogTitle); }
      ogTitle.content = item.title;
      
      var ogDesc = document.querySelector('meta[property="og:description"]');
      if (!ogDesc) { ogDesc = document.createElement('meta'); ogDesc.setAttribute('property', 'og:description'); document.head.appendChild(ogDesc); }
      ogDesc.content = excerpt;
      
      var ogImage = document.querySelector('meta[property="og:image"]');
      if (!ogImage) { ogImage = document.createElement('meta'); ogImage.setAttribute('property', 'og:image'); document.head.appendChild(ogImage); }
      ogImage.content = img;

      // Gunakan share.php sebagai URL yang dibagikan ke sosial media
      var currentUrl = new URL(window.location.href);
      var shareUrl = currentUrl.origin + currentUrl.pathname.replace('artikel.html', 'share.php') + currentUrl.search;
      
      // Bypass cache WhatsApp dengan menambah parameter timestamp
      shareUrl += (shareUrl.indexOf('?') > -1 ? '&' : '?') + '_c=' + new Date().getTime();
      
      // Teks WhatsApp persis seperti CNN Indonesia (Judul + URL)
      var waRawText = item.title + "\n" + shareUrl;
      var waText = encodeURIComponent(waRawText);
      var encodedUrl = encodeURIComponent(shareUrl);
      
      var waBtn = document.getElementById('shareWa');
      var fbBtn = document.getElementById('shareFb');
      var igBtn = document.getElementById('shareIg');

      waBtn.href = 'https://wa.me/?text=' + waText;
      fbBtn.href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodedUrl;

      [waBtn, fbBtn].forEach(function(btn) {
        btn.onclick = function() {
          trackShare(postKey);
        };
      });

      if (igBtn) {
        igBtn.onclick = function(e) {

            alert('Tautan disalin! Silakan paste/bagikan tautan ini di Instagram Anda.');
            trackShare(postKey);
          });
        };
      }

      // View & Like & Comment
      var postKey = 'art_' + (item.wp_id || item.title.substring(0,20));
      initEngage(postKey);

      // Related articles
      var relHtml = '';
      allItems.forEach(function(rel, i) {
        if (rel.wp_id && item.wp_id && rel.wp_id === item.wp_id) return;
        var relImg = rel.thumbnail || 'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=200&q=80';
        var relLink = 'artikel.html?id=' + (rel.wp_id || i);
        relHtml += '<div class="art-related-item" onclick="window.location.href=\'' + relLink + '\'">' +
          '<img src="' + relImg + '" alt="' + rel.title + '" class="art-related-img" onerror="this.src=\'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=200&q=80\'" />' +
          '<div class="art-related-info">' +
            '<div class="art-related-title">' + rel.title + '</div>' +
            '<div class="art-related-date">' + fmtDate(rel.pubDate) + '</div>' +
          '</div>' +
        '</div>';
      });
      document.getElementById('artRelated').innerHTML = relHtml;

      document.getElementById('artLoading').style.display = 'none';
      document.getElementById('artMain').style.display = 'grid';
      window.scrollTo(0,0);
    }

    // Load artikel
    function tryLoad() {
      var postId = params.get('id');
      if (!postId) { postId = '0'; }

      if (typeof fetchFromWP === 'function') {
        fetchFromWP(function(items) {
          var foundIdx = -1;
          for(var i=0; i<items.length; i++) {
            if(items[i].wp_id && items[i].wp_id.toString() === postId.toString()) {
              foundIdx = i; break;
            }
          }
          if (foundIdx === -1) {
            foundIdx = parseInt(postId) || 0;
          }
          loadArticle(items, items, foundIdx);
        });
      } else {
        setTimeout(tryLoad, 100);
      }
    }
    tryLoad();

    // =============================================
    // ENGAGE: View, Like, Comment (Firebase)
    // =============================================
    var currentPostKey = '';
        var db = null;
    var unsubComments = null;

    function initFirebaseEngage() {
      if (typeof firebase !== 'undefined' && firebase.apps.length) {
        db = firebase.firestore();
        
      }
    }

    

    

    function initEngage(postKey) {
      currentPostKey = postKey;
      initFirebaseEngage();

      // Set initial values from localStorage to prevent empty flickers
      var likes = parseInt(localStorage.getItem(postKey + '_likes') || '0');
      var currentReaction = localStorage.getItem(postKey + '_reaction');
      document.getElementById('artLikeCount').textContent = likes;
      updateLikeBtn(currentReaction);

      if (!db) {
        // Fallback to localStorage if Firebase not connected
        var views = parseInt(localStorage.getItem(postKey + '_views') || '0');
        var shares = parseInt(localStorage.getItem(postKey + '_shares') || '0');
        
        // increment view
        views++;
        localStorage.setItem(postKey + '_views', views);
        
        document.getElementById('artViewCount').textContent = views;
        document.getElementById('artShareCount').textContent = shares;
        return;
      }

      var docRef = db.collection('berita_stats').doc(postKey);
      
      // Realtime listener for views, likes, shares
      docRef.onSnapshot(function(doc) {
        if (doc.exists) {
          var data = doc.data();
          document.getElementById('artViewCount').textContent = data.views || 0;
          document.getElementById('artLikeCount').textContent = data.likes || 0;
          document.getElementById('artShareCount').textContent = data.shares || 0;
          
          // Sync likes to localStorage to keep button state consistent
          localStorage.setItem(postKey + '_likes', data.likes || 0);
        } else {
          // Init doc if not exists
          docRef.set({ views: 1, likes: 0, shares: 0 });
        }
      });

      // Increment View
      db.runTransaction(function(transaction) {
        return transaction.get(docRef).then(function(doc) {
          if (!doc.exists) {
            transaction.set(docRef, { views: 1, likes: 0, shares: 0 });
          } else {
            var newViews = (doc.data().views || 0) + 1;
            transaction.update(docRef, { views: newViews });
          }
        });
      }).catch(function(err){ console.log("View transaction failed: ", err); });

      // Load comments
      if (unsubComments) unsubComments();
      unsubComments = docRef.collection('comments').orderBy('date', 'desc').onSnapshot(function(snap) {
        var comments = [];
        snap.forEach(function(doc) {
          comments.push(doc.data());
        });
        renderComments(comments);
      });
    }

    window.trackShare = function(postKey) {
      if (!postKey) postKey = currentPostKey;
      if (!db) {
         var shares = parseInt(localStorage.getItem(postKey + '_shares') || '0');
         shares++;
         localStorage.setItem(postKey + '_shares', shares);
         var shareEl = document.getElementById('artShareCount');
         if (shareEl) shareEl.textContent = shares;
         return;
      }
      var docRef = db.collection('berita_stats').doc(postKey);
      docRef.update({
        shares: firebase.firestore.FieldValue.increment(1)
      }).catch(function(){});
    };

    
    const reactionDict = {
      'like': { icon: '👍', color: '#1a3a6b', text: 'Suka' },
      'love': { icon: '❤️', color: '#e0245e', text: 'Super' },
      'care': { icon: '🥰', color: '#f0c040', text: 'Peduli' },
      'haha': { icon: '😂', color: '#f0c040', text: 'Haha' },
      'wow':  { icon: '😲', color: '#f0c040', text: 'Wow' },
      'sad':  { icon: '😢', color: '#f0c040', text: 'Sedih' },
      'angry':{ icon: '😡', color: '#e0245e', text: 'Marah' }
    };

    window.toggleLike = function() {
      // If clicking the main button, just toggle 'like' or remove
      var postKey = currentPostKey;
      var currentReaction = localStorage.getItem(postKey + '_reaction');
      
      if (currentReaction) {
        // Remove reaction
        setReaction(null);
      } else {
        // Default to like
        setReaction('like');
      }
    };

    window.setReaction = function(type, e) {
      if (e) e.stopPropagation();
      var postKey = currentPostKey;
      var oldReaction = localStorage.getItem(postKey + '_reaction');
      
      if (oldReaction === type) return; // No change

      localStorage.setItem(postKey + '_reaction', type || '');
      updateLikeBtn(type);

      if (!db) {
        // Fallback for likes
        var likes = parseInt(localStorage.getItem(postKey + '_likes') || '0');
        if (type && !oldReaction) likes++;
        if (!type && oldReaction) likes--;
        localStorage.setItem(postKey + '_likes', likes);
        document.getElementById('artLikeCount').textContent = likes;
        return;
      }
      var docRef = db.collection('berita_stats').doc(postKey);
      
      var updates = {};
      if (oldReaction) {
        updates['reactions.' + oldReaction] = firebase.firestore.FieldValue.increment(-1);
      }
      if (type) {
        updates['reactions.' + type] = firebase.firestore.FieldValue.increment(1);
      }
      
      // Update overall likes count as sum (or we just rely on reactions sum)
      if (type && !oldReaction) updates.likes = firebase.firestore.FieldValue.increment(1);
      if (!type && oldReaction) updates.likes = firebase.firestore.FieldValue.increment(-1);

      docRef.update(updates).catch(function(err){
         console.log(err);
         // if update fails, we might want to revert UI, but let's keep it simple
      });
    };

    function updateLikeBtn(type) {
      var btn = document.getElementById('artLikeBtn');
      var icon = document.getElementById('artLikeIcon');
      var text = document.getElementById('artLikeText');
      
      if (type && reactionDict[type]) {
        btn.classList.add('liked');
        btn.style.color = reactionDict[type].color;
        icon.outerHTML = '<span id="artLikeIcon" style="font-size: 18px; margin-right: 6px;">' + reactionDict[type].icon + '</span>';
        text.textContent = reactionDict[type].text;
      } else {
        btn.classList.remove('liked');
        btn.style.color = '';
        var currentIcon = document.getElementById('artLikeIcon');
        currentIcon.outerHTML = '<i class="far fa-thumbs-up" id="artLikeIcon"></i>';
        text.textContent = 'Suka';
      }
    }



    window.submitComment = function() {
      var postKey = currentPostKey;
      var name = document.getElementById('commentName').value.trim();
      var text = document.getElementById('commentText').value.trim();
      
      if (!name) { alert('Nama tidak boleh kosong.'); return; }
      if (!text) { alert('Komentar tidak boleh kosong.'); return; }

      if (!db) return alert('Koneksi database bermasalah.');

      var docRef = db.collection('berita_stats').doc(postKey).collection('comments').doc();
      docRef.set({
        name: name,
        photoURL: '',
        text: text,
        date: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function() {
        document.getElementById('commentName').value = '';
        document.getElementById('commentText').value = '';
      }).catch(function(err) {
        alert('Gagal mengirim komentar: ' + err.message);
      });
    };

    function renderComments(comments) {
      var list = document.getElementById('artCommentList');
      var countEl = document.getElementById('artCommentCount');
      countEl.textContent = comments.length;

      if (!comments.length) {
        list.innerHTML = '<div class="art-no-comment">Belum ada komentar. Jadilah yang pertama!</div>';
        return;
      }

      var months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      list.innerHTML = comments.map(function(c) {
        var dt = c.date && c.date.toDate ? c.date.toDate() : new Date();
        var tgl = dt.getDate() + ' ' + months[dt.getMonth()] + ' ' + dt.getFullYear() + ' ' + ('0'+dt.getHours()).slice(-2) + ':' + ('0'+dt.getMinutes()).slice(-2);
        var avatar = c.photoURL ? '<img src="'+escHtml(c.photoURL)+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" />' : '<i class="fas fa-user"></i>';
        
        return '<div class="art-comment-item">' +
          '<div class="art-comment-header">' +
            '<div class="art-comment-avatar" style="padding:0; overflow:hidden;">' + avatar + '</div>' +
            '<span class="art-comment-name">' + escHtml(c.name) + '</span>' +
            '<span class="art-comment-date">' + tgl + '</span>' +
          '</div>' +
          '<div class="art-comment-text">' + escHtml(c.text).replace(/\n/g, '<br>') + '</div>' +
        '</div>';
      }).join('');
    }

    function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  })();
  </script>
  <script src="navbar.js"></script>
</body>
