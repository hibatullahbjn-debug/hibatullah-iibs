<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="#1a2e6b" stroke="#1a2e6b" stroke-width="2"/>

  <!-- Open Book (bottom) -->
  <g transform="translate(100,148)">
    <!-- Left page -->
    <path d="M-52,-8 Q-26,-18 0,-10 L0,10 Q-26,2 -52,12 Z" fill="#3a5bd9" stroke="#0d1f5c" stroke-width="1.5"/>
    <!-- Right page -->
    <path d="M52,-8 Q26,-18 0,-10 L0,10 Q26,2 52,12 Z" fill="#3a5bd9" stroke="#0d1f5c" stroke-width="1.5"/>
    <!-- Spine -->
    <ellipse cx="0" cy="0" rx="3" ry="12" fill="#0d1f5c"/>
    <!-- Book bottom curve -->
    <path d="M-52,12 Q0,22 52,12" fill="none" stroke="#3a5bd9" stroke-width="3"/>
  </g>

  <!-- Orange flower/ornament petals -->
  <!-- Center petal (bottom) -->
  <ellipse cx="100" cy="128" rx="10" ry="16" fill="#e07030" stroke="#1a0a00" stroke-width="1.5"/>
  <!-- Left petal -->
  <ellipse cx="72" cy="112" rx="16" ry="10" fill="#e07030" stroke="#1a0a00" stroke-width="1.5" transform="rotate(-30,72,112)"/>
  <!-- Right petal -->
  <ellipse cx="128" cy="112" rx="16" ry="10" fill="#e07030" stroke="#1a0a00" stroke-width="1.5" transform="rotate(30,128,112)"/>
  <!-- Far left petal -->
  <ellipse cx="62" cy="100" rx="14" ry="9" fill="#e07030" stroke="#1a0a00" stroke-width="1.5" transform="rotate(-55,62,100)"/>
  <!-- Far right petal -->
  <ellipse cx="138" cy="100" rx="14" ry="9" fill="#e07030" stroke="#1a0a00" stroke-width="1.5" transform="rotate(55,138,100)"/>

  <!-- Blue flame/teardrop shapes (top) -->
  <!-- Left flame -->
  <path d="M100,40 C80,50 68,70 78,88 C84,98 96,100 100,100 C104,100 116,98 122,88 C132,70 120,50 100,40Z" fill="#3a4fc8" stroke="#0d1f5c" stroke-width="1.5"/>
  <!-- Left wing -->
  <path d="M100,55 C85,52 68,58 65,72 C62,84 72,92 82,90 C90,88 96,80 100,72Z" fill="#3a4fc8" stroke="#0d1f5c" stroke-width="1.5"/>
  <!-- Right wing -->
  <path d="M100,55 C115,52 132,58 135,72 C138,84 128,92 118,90 C110,88 104,80 100,72Z" fill="#3a4fc8" stroke="#0d1f5c" stroke-width="1.5"/>

  <!-- Dark center teardrop -->
  <path d="M100,52 C95,60 93,70 96,80 C97,84 100,86 100,86 C100,86 103,84 104,80 C107,70 105,60 100,52Z" fill="#0d1f5c"/>
  <!-- Dark center bottom -->
  <ellipse cx="100" cy="100" rx="8" ry="10" fill="#0d1f5c"/>
</svg>
